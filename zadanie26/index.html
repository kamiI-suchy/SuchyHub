<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 26 – sterownik znakowy z timerem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <div class="card-main">
        <h1>Zadanie 26 – sterownik znakowy z timerem</h1>
        <p class="desc"><a class="pdf-link" href="zad26.pdf" target="_blank">Otwórz treść zadania (PDF)</a></p>
        <p class="desc">Sterownik /dev/sterownik z timerem (1, 4, 8 s). Wpisz imię i nazwisko.</p>

        <div class="accordion" id="acc1">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#c1"
                            aria-expanded="false">
                        Pokaż instrukcję do wykonania zadania
                    </button>
                </h2>
                <div id="c1" class="accordion-collapse collapse" data-bs-parent="#acc1">
                    <div class="accordion-body" id="c1-body">Ładowanie instrukcji...</div>
                </div>
            </div>
        </div>

        <label for="name">Imię i nazwisko:</label>
        <input type="text" id="name" placeholder="np. Jan Kowalski">

        <button class="btn-primary mt-btn" onclick="generuj()">Generuj kod</button>

        <div id="output-wrapper" class="code-block-wrapper">
            <div class="btn-group">
                <button class="action-btn" onclick="SuchyHub.copyToClipboard(document.getElementById('output').textContent)">Kopiuj</button>
                <button class="action-btn" onclick="SuchyHub.downloadFile(document.getElementById('output').textContent,'timer_driver.c')">Pobierz</button>
            </div>
            <pre class="code-block" id="output"></pre>
        </div>

        <a class="back" href="../index.html">&larr; Powrót</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app.js"></script>
    <script>
        SuchyHub.initAccordion('c1', 'c1-body', 'uruchomienie.txt');

        var template = null;

        async function ensureTemplate() {
            if (template) return;
            var r = await fetch('timer_driver.c', { cache: 'no-store' });
            if (!r.ok) throw new Error('Nie udało się pobrać timer_driver.c');
            template = await r.text();
        }

        async function generuj() {
            var name = document.getElementById('name').value.trim();
            if (!name) { alert('Proszę wpisać imię i nazwisko.'); return; }
            try {
                await ensureTemplate();
                var escapedName = SuchyHub.escapeCString(name);
                var code = template.replace(/MODULE_AUTHOR\("[^"]*"\)/, 'MODULE_AUTHOR("' + escapedName + '")');
                document.getElementById('output').textContent = code;
                document.getElementById('output-wrapper').classList.add('visible');
            } catch (e) {
                alert('Błąd generowania kodu: ' + e.message);
            }
        }
    </script>
</body>
</html>
