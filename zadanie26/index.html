<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 26 – sterownik znakowy z timerem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(14, 116, 189, 0.12);
            padding: 40px 36px 32px;
            max-width: 760px;
            width: 100%;
        }
        h1 {
            margin: 0 0 6px;
            color: #0e74bd;
            font-size: 1.6em;
        }
        p.desc {
            color: #5a8fa8;
            margin: 0 0 24px;
            font-size: 0.95em;
            line-height: 1.5;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #0e74bd;
            font-size: 0.95em;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 1em;
            margin-top: 6px;
            border: 1.5px solid #bae0f5;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.15s;
            color: #1a3a4a;
        }
        input[type="text"]:focus { border-color: #0e74bd; }
        button.generate-btn {
            margin-top: 24px;
            padding: 11px 32px;
            font-size: 1em;
            font-weight: 600;
            background: linear-gradient(90deg, #0e74bd, #38bdf8);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(14, 116, 189, 0.18);
            transition: opacity 0.15s;
        }
        button.generate-btn:hover { opacity: 0.9; }
        .code-block-wrapper {
            position: relative;
            margin-top: 28px;
            display: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(14, 116, 189, 0.10);
        }
        .code-block-wrapper.visible { display: block; }
        pre.code-block {
            background: #0f2233;
            color: #cce8f8;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 0.9em;
            padding: 20px;
            margin: 0;
            overflow-x: auto;
            white-space: pre;
            min-height: 140px;
        }
        .btn-group {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
        }
        .action-btn {
            padding: 4px 12px;
            font-size: 0.8em;
            background: #1a6a9a;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .action-btn:hover {
            background: #38bdf8;
            color: #0f2233;
        }
        a.back {
            display: inline-block;
            margin-top: 24px;
            color: #0e74bd;
            font-size: 0.95em;
            text-decoration: none;
        }
        a.back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Zadanie 26 – sterownik znakowy z timerem</h1>
        <div class="section">
            <p><a href="zad26.pdf" target="_blank">Otwórz treść zadania (PDF)</a></p>
        </div>
        <p class="desc">
            Sterownik /dev/sterownik z timerem (1, 4, 8 s).
            Wpisz imię i nazwisko.
        </p>
        <section class="mb-3">
            <div class="accordion" id="acc1">
                <div class="accordion-item">
                    <h3 class="accordion-header">
                        <button class="accordion-button collapsed" 
                                data-bs-toggle="collapse" 
                                data-bs-target="#c1"
                                aria-expanded="false">
                            Pokaż instrukcję do wykonania zadania
                        </button>
                    </h3>
                    <div id="c1" 
                         class="accordion-collapse collapse" 
                         data-bs-parent="#acc1">
                        <div class="accordion-body" id="c1-body" style="white-space: pre-wrap;">
                            Ładowanie instrukcji...
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <label for="name">Imię i nazwisko:</label>
        <input type="text" id="name" placeholder="np. Jan Kowalski">

        <br>
        <button class="generate-btn" onclick="generuj()">Generuj kod</button>

        <div id="output-wrapper" class="code-block-wrapper">
            <div class="btn-group">
                <button class="action-btn" onclick="kopiuj(event)">Kopiuj</button>
                <button class="action-btn" onclick="pobierz()">Pobierz</button>
            </div>
            <pre class="code-block" id="output"></pre>
        </div>
        <a class="back" href="../index.html">← Powrót</a>
    </div>

    <script>
        let template = null;

        async function ensureTemplate() {
            if (template) return;
            const res = await fetch("timer_driver.c", { cache: "no-store" });
            if (!res.ok) throw new Error("Nie udało się pobrać timer_driver.c");
            template = await res.text();
        }

        function escapeCString(text) {
            return text.replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
        }

        async function generuj() {
            const name = document.getElementById("name").value.trim();
            if (!name) {
                alert("Proszę wpisać imię i nazwisko.");
                return;
            }
            try {
                await ensureTemplate();
                const escapedName = escapeCString(name);
                const code = template.replace(/MODULE_AUTHOR\("[^"]*"\)/, `MODULE_AUTHOR("${escapedName}")`);
                document.getElementById("output").textContent = code;
                document.getElementById("output-wrapper").classList.add("visible");
            } catch (error) {
                alert("Błąd generowania kodu: " + error.message);
            }
        }

        function kopiuj(event) {
            const text = document.getElementById("output").textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                if (btn && btn.classList.contains('action-btn')) {
                    const original = btn.textContent;
                    btn.textContent = "Skopiowano!";
                    setTimeout(() => { btn.textContent = original; }, 2000);
                }
            });
        }

        function pobierz() {
            const text = document.getElementById("output").textContent;
            const blob = new Blob([text], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "timer_driver.c";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const collapseEl = document.getElementById('c1');
            const bodyEl = document.getElementById('c1-body');
            let loaded = false;

            collapseEl.addEventListener('show.bs.collapse', function () {
                if (!loaded) {
                    fetch('uruchomienie.txt')
                        .then(response => {
                            if (!response.ok) throw new Error('Błąd ' + response.status);
                            return response.text();
                        })
                        .then(text => {
                            bodyEl.textContent = text;
                            loaded = true;
                        })
                        .catch(error => {
                            bodyEl.textContent = 'Nie udało się wczytać instrukcji: ' + error.message;
                            loaded = true;
                        });
                }
            });
        })();
    </script>
</body>
</html>
