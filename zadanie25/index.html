<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zadanie 25 – sterownik obslugi przerwan</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="card card--medium">
    <h1>Zadanie 25 – sterownik obslugi przerwan</h1>
    <p class="desc"><a class="pdf-link" href="zad25.pdf" target="_blank">Otworz tresc zadania (PDF)</a></p>
    <p class="desc">Obsluga przerwan dla GPIO68 (zolty) i GPIO69 (niebieski). Wpisz imie i nazwisko.</p>

    <details class="accordion" id="acc">
        <summary>Pokaz instrukcje do wykonania zadania</summary>
        <div class="acc-body" id="acc-body">Ladowanie instrukcji...</div>
    </details>

    <label for="name">Imie i nazwisko:</label>
    <input type="text" id="name" placeholder="np. Jan Kowalski">

    <button class="btn mt" onclick="gen()">Generuj kod</button>

    <div id="out-wrap" class="code-wrap">
        <div class="code-actions">
            <button onclick="Suchy.copy(document.getElementById('out').textContent)">Kopiuj</button>
            <button onclick="Suchy.download(document.getElementById('out').textContent,'interrupt_button.c')">Pobierz</button>
        </div>
        <pre class="code" id="out"></pre>
    </div>

    <a class="back-link" href="../index.html">Powrot</a>
</div>

<script src="../app.js"></script>
<script>
    Suchy.accordion('acc','acc-body','uruchomienie.txt');

    let tpl=null;
    async function load(){
        if(tpl) return;
        const r=await fetch('interrupt_button.c',{cache:'no-store'});
        if(!r.ok) throw new Error('Nie udalo sie pobrac interrupt_button.c');
        tpl=await r.text();
    }

    async function gen(){
        const name=document.getElementById('name').value.trim();
        if(!name){alert('Wpisz imie i nazwisko.');return;}
        try{
            await load();
            const code=tpl.replace(/MODULE_AUTHOR\("[^"]*"\)/,`MODULE_AUTHOR("${Suchy.escapeC(name)}")`);
            document.getElementById('out').textContent=code;
            document.getElementById('out-wrap').classList.add('show');
        }catch(e){alert('Blad: '+e.message);}
    }
</script>
</body>
</html>
