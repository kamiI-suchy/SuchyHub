<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zadanie 22 – sterownik blokowy</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="card card--wide">
    <h1>Zadanie 22 – sterownik blokowy</h1>
    <p class="desc"><a class="pdf-link" href="zad22.pdf" target="_blank">Otworz tresc zadania (PDF)</a></p>
    <p class="desc">Wpisz imie i nazwisko oraz numer indeksu, nastepnie wybierz wersje sterownika.</p>

    <details class="accordion" id="acc">
        <summary>Pokaz instrukcje do wykonania zadania</summary>
        <div class="acc-body" id="acc-body">Ladowanie instrukcji...</div>
    </details>

    <label for="name">Imie i nazwisko:</label>
    <input type="text" id="name" placeholder="np. Jan Kowalski">

    <label for="idx">Numer indeksu:</label>
    <input type="text" id="idx" placeholder="np. 60000">

    <div class="btn-row">
        <button class="btn" onclick="gen('nowe')">Dla nowych jader</button>
        <button class="btn" onclick="gen('bbb')">Dla BBB</button>
    </div>

    <div id="vt" class="variant-tag"></div>
    <div id="files" class="file-list"></div>

    <a class="back-link" href="../index.html">Powrot</a>
</div>

<script src="../app.js"></script>
<script>
    Suchy.accordion('acc', 'acc-body', 'uruchomienie.txt');

    let rT='', bT='', rMk='', bMk='', bPr='';

    async function load(){
        if(rT&&bT&&rMk&&bMk&&bPr) return;
        const [a,b,c,d,e]=await Promise.all([
            fetch('index_block.c',{cache:'no-store'}),
            fetch('bbb/index_block.c',{cache:'no-store'}),
            fetch('Makefile',{cache:'no-store'}),
            fetch('bbb/Makefile',{cache:'no-store'}),
            fetch('bbb/prepare',{cache:'no-store'})
        ]);
        [rT,bT,rMk,bMk,bPr]=await Promise.all([a.text(),b.text(),c.text(),d.text(),e.text()]);
    }

    function apply(tpl,name,idx){
        const n=Suchy.escapeC(name), il=Suchy.escapeC(idx)+'\\n';
        return tpl
            .replace(/#define EXPECTED_NAME "[^"]*"/,`#define EXPECTED_NAME "${n}"`)
            .replace(/#define INDEX_NUMBER "[^"]*"/,`#define INDEX_NUMBER "${il}"`)
            .replace(/MODULE_AUTHOR\("[^"]*"\)/,`MODULE_AUTHOR("${n}")`);
    }

    async function gen(v){
        const name=document.getElementById('name').value.trim();
        const idx=document.getElementById('idx').value.trim();
        if(!name){alert('Wpisz imie i nazwisko.');return;}
        if(!/^[0-9]+$/.test(idx)){alert('Numer indeksu powinien zawierac tylko cyfry.');return;}
        try{
            await load();
            const b=v==='bbb';
            const code=apply(b?bT:rT,name,idx);
            const mk=b?bMk:rMk;
            const files=[{name:'index_block.c',content:code},{name:'Makefile',content:mk}];
            if(b) files.push({name:'prepare',content:bPr});
            Suchy.renderFiles('files',files);
            document.getElementById('vt').textContent=b?'Wybrany wariant: BBB':'Wybrany wariant: nowe jadra';
            document.getElementById('vt').classList.add('show');
        }catch(e){alert('Blad: '+e.message);}
    }
</script>
</body>
</html>
