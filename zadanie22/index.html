<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 22 – sterownik blokowy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <div class="card-main wide">
        <h1>Zadanie 22 – sterownik blokowy</h1>
        <p class="desc"><a class="pdf-link" href="zad22.pdf" target="_blank">Otwórz treść zadania (PDF)</a></p>
        <p class="desc">Wpisz imię i nazwisko oraz numer indeksu, następnie wybierz wersję sterownika.</p>

        <div class="accordion" id="acc1">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#c1"
                            aria-expanded="false">
                        Pokaż instrukcję do wykonania zadania
                    </button>
                </h2>
                <div id="c1" class="accordion-collapse collapse" data-bs-parent="#acc1">
                    <div class="accordion-body" id="c1-body">Ładowanie instrukcji...</div>
                </div>
            </div>
        </div>

        <label for="name">Imię i nazwisko:</label>
        <input type="text" id="name" placeholder="np. Jan Kowalski">

        <label for="indexNo">Numer indeksu:</label>
        <input type="text" id="indexNo" placeholder="np. 60000">

        <div class="btn-row">
            <button class="btn-primary" onclick="generuj('nowe')">Generuj dla nowych jąder</button>
            <button class="btn-primary" onclick="generuj('bbb')">Generuj dla BBB</button>
        </div>

        <div id="variant-info" class="variant-info"></div>
        <div id="files" class="files-container"></div>

        <a class="back" href="../index.html">&larr; Powrót</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app.js"></script>
    <script>
        SuchyHub.initAccordion('c1', 'c1-body', 'uruchomienie.txt');

        var rootTemplate = '', bbbTemplate = '';
        var rootMakefile = '', bbbMakefile = '', bbbPrepare = '';

        async function ensureTemplates() {
            if (rootTemplate && bbbTemplate && rootMakefile && bbbMakefile && bbbPrepare) return;
            var _a = await Promise.all([
                fetch('index_block.c', { cache: 'no-store' }),
                fetch('bbb/index_block.c', { cache: 'no-store' }),
                fetch('Makefile', { cache: 'no-store' }),
                fetch('bbb/Makefile', { cache: 'no-store' }),
                fetch('bbb/prepare', { cache: 'no-store' })
            ]);
            var _b = await Promise.all([_a[0].text(), _a[1].text(), _a[2].text(), _a[3].text(), _a[4].text()]);
            rootTemplate = _b[0]; bbbTemplate = _b[1];
            rootMakefile = _b[2]; bbbMakefile = _b[3]; bbbPrepare = _b[4];
        }

        function applyPersonData(template, name, indexNumber) {
            var escapedName = SuchyHub.escapeCString(name);
            var indexLine = SuchyHub.escapeCString(indexNumber) + '\\n';
            return template
                .replace(/#define EXPECTED_NAME "[^"]*"/, '#define EXPECTED_NAME "' + escapedName + '"')
                .replace(/#define INDEX_NUMBER "[^"]*"/, '#define INDEX_NUMBER "' + indexLine + '"')
                .replace(/MODULE_AUTHOR\("[^"]*"\)/, 'MODULE_AUTHOR("' + escapedName + '")');
        }

        async function generuj(variant) {
            var name = document.getElementById('name').value.trim();
            var indexRaw = document.getElementById('indexNo').value.trim();

            if (!name) { alert('Proszę wpisać imię i nazwisko.'); return; }
            if (!/^[0-9]+$/.test(indexRaw)) { alert('Numer indeksu powinien zawierać tylko cyfry.'); return; }

            try {
                await ensureTemplates();
                var isBbb = variant === 'bbb';
                var template = isBbb ? bbbTemplate : rootTemplate;
                var makefile = isBbb ? bbbMakefile : rootMakefile;
                var code = applyPersonData(template, name, indexRaw);
                var files = [
                    { name: 'index_block.c', content: code },
                    { name: 'Makefile', content: makefile }
                ];
                if (isBbb) files.push({ name: 'prepare', content: bbbPrepare });

                SuchyHub.renderCodeBlocks('files', files);

                var info = document.getElementById('variant-info');
                info.textContent = isBbb ? 'Wybrana wersja: BBB' : 'Wybrana wersja: nowe jądra';
                info.classList.add('visible');
            } catch (e) {
                alert('Błąd generowania kodu: ' + e.message);
            }
        }
    </script>
</body>
</html>
