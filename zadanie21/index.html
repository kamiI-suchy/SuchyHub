<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zadanie 21 – sterownik znakowy LED</title>
<link rel="stylesheet" href="../style.css">
<style>#inicjaly{text-transform:uppercase}</style>
</head>
<body>
<div class="card card--medium">
    <h1>Zadanie 21 – sterownik znakowy LED</h1>
    <p class="desc"><a class="pdf-link" href="lab21.pdf" target="_blank">Otworz tresc zadania (PDF)</a></p>
    <p class="desc">Wpisz imie i nazwisko oraz inicjaly (litery A–Z), ktore maja zapalac LED po przeslaniu do urzadzenia znakowego.</p>

    <details class="accordion" id="acc">
        <summary>Pokaz instrukcje do wykonania zadania</summary>
        <div class="acc-body" id="acc-body">Ladowanie instrukcji...</div>
    </details>

    <label for="name">Imie i nazwisko:</label>
    <input type="text" id="name" placeholder="np. Jan Kowalski">

    <label for="inicjaly">Inicjaly (litery A–Z):</label>
    <input type="text" id="inicjaly" placeholder="np. JK" maxlength="5" class="upper">

    <button class="btn mt" onclick="gen()">Generuj kod</button>

    <div id="files" class="file-list"></div>

    <a class="back-link" href="../index.html">Powrot</a>
</div>

<script src="../app.js"></script>
<script>
    Suchy.accordion('acc', 'acc-body', 'uruchomienie.txt');

    let led='', mk='', prep='';

    async function load(){
        if(led&&mk&&prep) return;
        const [a,b,c]=await Promise.all([
            fetch('led_char.c',{cache:'no-store'}),
            fetch('Makefile',{cache:'no-store'}),
            fetch('prepare',{cache:'no-store'})
        ]);
        [led,mk,prep]=await Promise.all([a.text(),b.text(),c.text()]);
    }

    function initialsCheck(s){
        const u=[...new Set(s.split(''))];
        return u.map(c=>`ch=='${c}'`).join('||');
    }

    async function gen(){
        const name=document.getElementById('name').value.trim();
        const raw=document.getElementById('inicjaly').value.trim().toUpperCase();
        const init=raw.replace(/[^A-Z]/g,'');
        if(!name){alert('Wpisz imie i nazwisko.');return;}
        if(!init){alert('Wpisz inicjaly (litery A–Z).');return;}
        try{
            await load();
            let code=led.replace(/return ch ==[^;]*;/,`return ${initialsCheck(init)};`);
            code=code.replace(/MODULE_AUTHOR\("[^"]*"\)/,`MODULE_AUTHOR("${Suchy.escapeC(name)}")`);
            Suchy.renderFiles('files',[
                {name:'led_char.c',content:code},
                {name:'Makefile',content:mk},
                {name:'prepare',content:prep}
            ]);
        }catch(e){alert('Blad: '+e.message);}
    }
</script>
</body>
</html>
