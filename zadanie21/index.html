<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 21 – sterownik znakowy LED</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
    <style>
        #inicjaly { text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card-main">
        <h1>Zadanie 21 – sterownik znakowy LED</h1>
        <p class="desc"><a class="pdf-link" href="lab21.pdf" target="_blank">Otwórz treść zadania (PDF)</a></p>
        <p class="desc">Wpisz imię i nazwisko oraz inicjały (litery A–Z), które mają zapalać LED po przesłaniu do urządzenia znakowego.</p>

        <div class="accordion" id="acc1">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#c1"
                            aria-expanded="false">
                        Pokaż instrukcję do wykonania zadania
                    </button>
                </h2>
                <div id="c1" class="accordion-collapse collapse" data-bs-parent="#acc1">
                    <div class="accordion-body" id="c1-body">Ładowanie instrukcji...</div>
                </div>
            </div>
        </div>

        <label for="name">Imię i nazwisko:</label>
        <input type="text" id="name" placeholder="np. Jan Kowalski">

        <label for="inicjaly">Inicjały (litery A–Z):</label>
        <input type="text" id="inicjaly" placeholder="np. JK" maxlength="5" class="uppercase">

        <button class="btn-primary mt-btn" onclick="generuj()">Generuj kod</button>

        <div id="files" class="files-container"></div>

        <a class="back" href="../index.html">&larr; Powrót</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app.js"></script>
    <script>
        SuchyHub.initAccordion('c1', 'c1-body', 'uruchomienie.txt');

        var ledCharTemplate = '', makefileText = '', prepareText = '';

        async function ensureTemplates() {
            if (ledCharTemplate && makefileText && prepareText) return;
            var _a = await Promise.all([
                fetch('led_char.c', { cache: 'no-store' }),
                fetch('Makefile', { cache: 'no-store' }),
                fetch('prepare', { cache: 'no-store' })
            ]);
            var _b = await Promise.all([_a[0].text(), _a[1].text(), _a[2].text()]);
            ledCharTemplate = _b[0]; makefileText = _b[1]; prepareText = _b[2];
        }

        function buildInitialsCheck(initials) {
            var unique = [];
            for (var i = 0; i < initials.length; i++) {
                if (unique.indexOf(initials[i]) === -1) unique.push(initials[i]);
            }
            return unique.map(function(ch) { return "ch == '" + ch + "'"; }).join(' || ');
        }

        async function generuj() {
            var name = document.getElementById('name').value.trim();
            var raw = document.getElementById('inicjaly').value.trim().toUpperCase();
            var initials = raw.replace(/[^A-Z]/g, '');

            if (!name) { alert('Proszę wpisać imię i nazwisko.'); return; }
            if (!initials) { alert('Proszę wpisać inicjały (litery A–Z).'); return; }

            try {
                await ensureTemplates();
                var check = buildInitialsCheck(initials);
                var escapedName = SuchyHub.escapeCString(name);
                var updated = ledCharTemplate
                    .replace(/return ch ==[^;]*;/, 'return ' + check + ';')
                    .replace(/MODULE_AUTHOR\("[^"]*"\)/, 'MODULE_AUTHOR("' + escapedName + '")');

                SuchyHub.renderCodeBlocks('files', [
                    { name: 'led_char.c', content: updated },
                    { name: 'Makefile', content: makefileText },
                    { name: 'prepare', content: prepareText }
                ]);
            } catch (e) {
                alert('Błąd generowania kodu: ' + e.message);
            }
        }
    </script>
</body>
</html>
