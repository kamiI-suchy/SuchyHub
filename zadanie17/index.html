<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zadanie 17 – modul jadra</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="card card--narrow">
    <h1>Zadanie 17 – modul jadra Linuksa</h1>
    <p class="desc"><a class="pdf-link" href="lab17.pdf" target="_blank">Otworz tresc zadania (PDF)</a></p>

    <details class="accordion" id="acc">
        <summary>Pokaz instrukcje do wykonania zadania</summary>
        <div class="acc-body" id="acc-body">Ladowanie instrukcji...</div>
    </details>

    <p class="desc" style="margin-top:16px">Uzupelnij imie i nazwisko oraz numer albumu.</p>

    <label for="imie">Imie i nazwisko:</label>
    <input type="text" id="imie" placeholder="np. Jan Kowalski">

    <label for="album">Numer albumu:</label>
    <input type="number" id="album" placeholder="np. 60000">

    <button class="btn mt" onclick="gen()">Generuj kod</button>

    <div id="out-wrap" class="code-wrap">
        <div class="code-actions">
            <button onclick="Suchy.copy(document.getElementById('out').textContent)">Kopiuj</button>
            <button onclick="Suchy.download(document.getElementById('out').textContent,'hello_printk.c')">Pobierz</button>
        </div>
        <pre class="code" id="out"></pre>
    </div>

    <a class="back-link" href="../index.html">Powrot</a>
</div>

<script src="../app.js"></script>
<script>
    Suchy.accordion('acc', 'acc-body', 'uruchomienie.txt');

    function gen() {
        const imie = document.getElementById('imie').value.trim();
        const album = document.getElementById('album').value.trim();
        if (!imie || !album) { alert('Wypelnij oba pola.'); return; }

        document.getElementById('out').textContent = [
            '#include <linux/init.h>',
            '#include <linux/module.h>',
            '',
            'static int __init',
            'hello_init(void)',
            '{',
            '\tprintk("' + imie + '\\n");',
            '\treturn 0;',
            '}',
            '',
            'module_init(hello_init);',
            '',
            'static void __exit',
            'hello_exit(void)',
            '{',
            '\tprintk("' + album + '\\n");',
            '}',
            '',
            'module_exit(hello_exit);',
            '',
            'MODULE_LICENSE("GPL");',
            'MODULE_AUTHOR("' + imie + '");',
            'MODULE_DESCRIPTION("\\"Hello, world!\\" minimal module");',
            'MODULE_VERSION("printk");'
        ].join('\n');
        document.getElementById('out-wrap').classList.add('show');
    }
</script>
</body>
</html>
