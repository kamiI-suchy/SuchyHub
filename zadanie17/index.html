<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 17 – moduł jądra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../style.css" rel="stylesheet">
</head>
<body>
    <div class="card-main narrow">
        <h1>Zadanie 17 – moduł jądra Linuksa</h1>
        <p class="desc"><a class="pdf-link" href="lab17.pdf" target="_blank">Otwórz treść zadania (PDF)</a></p>

        <div class="accordion" id="acc1">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button"
                            data-bs-toggle="collapse" data-bs-target="#c1"
                            aria-expanded="false">
                        Pokaż instrukcję do wykonania zadania
                    </button>
                </h2>
                <div id="c1" class="accordion-collapse collapse" data-bs-parent="#acc1">
                    <div class="accordion-body" id="c1-body">Ładowanie instrukcji...</div>
                </div>
            </div>
        </div>

        <p class="desc" style="margin-top:16px">Uzupełnij imię i nazwisko oraz numer albumu.</p>

        <label for="imie">Imię i nazwisko:</label>
        <input type="text" id="imie" placeholder="np. Jan Kowalski">

        <label for="album">Numer albumu:</label>
        <input type="number" id="album" placeholder="np. 60000">

        <button class="btn-primary mt-btn" onclick="generuj()">Generuj kod</button>

        <div id="output-wrapper" class="code-block-wrapper">
            <div class="btn-group">
                <button class="action-btn" onclick="SuchyHub.copyToClipboard(document.getElementById('output').textContent)">Kopiuj</button>
                <button class="action-btn" onclick="SuchyHub.downloadFile(document.getElementById('output').textContent,'hello_printk.c')">Pobierz</button>
            </div>
            <pre class="code-block" id="output"></pre>
        </div>

        <a class="back" href="../index.html">&larr; Powrót</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../app.js"></script>
    <script>
        SuchyHub.initAccordion('c1', 'c1-body', 'uruchomienie.txt');

        function generuj() {
            var imie  = document.getElementById('imie').value.trim();
            var album = document.getElementById('album').value.trim();
            if (!imie || !album) { alert('Wypełnij oba pola.'); return; }

            var kod = [
                '#include <linux/init.h>',
                '#include <linux/module.h>',
                '',
                'static int __init',
                'hello_init(void)',
                '{',
                '\tprintk("' + imie + '\\n");',
                '\treturn 0;',
                '}',
                '',
                'module_init(hello_init);',
                '',
                'static void __exit',
                'hello_exit(void)',
                '{',
                '\tprintk("' + album + '\\n");',
                '}',
                '',
                'module_exit(hello_exit);',
                '',
                'MODULE_LICENSE("GPL");',
                'MODULE_AUTHOR("' + imie + '");',
                'MODULE_DESCRIPTION("\\"Hello, world!\\" minimal module");',
                'MODULE_VERSION("printk");'
            ].join('\n');

            document.getElementById('output').textContent = kod;
            document.getElementById('output-wrapper').classList.add('visible');
        }
    </script>
</body>
</html>
